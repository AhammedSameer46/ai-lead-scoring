<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 350px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      margin: 0;
    }
    
    .header {
      text-align: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 2px solid #0073b1;
    }
    
    h1 {
      margin: 0;
      font-size: 18px;
      color: #0073b1;
    }
    
    .subtitle {
      font-size: 12px;
      color: #666;
      margin-top: 4px;
    }
    
    button {
      width: 100%;
      padding: 12px;
      background: #0073b1;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
    }
    
    button:hover {
      background: #005885;
    }
    
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    
    .status {
      padding: 12px;
      border-radius: 6px;
      margin-top: 12px;
      font-size: 13px;
      display: none;
    }
    
    .status.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
      display: block;
    }
    
    .status.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      display: block;
    }
    
    .status.loading {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
      display: block;
    }
    
    .instructions {
      font-size: 12px;
      color: #666;
      margin-top: 12px;
      padding: 8px;
      background: #f5f5f5;
      border-radius: 4px;
    }
    
    .score-display {
      margin-top: 8px;
      padding: 8px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    
    .score {
      font-size: 24px;
      font-weight: bold;
      color: #0073b1;
    }
    
    .tier {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      margin-left: 8px;
    }
    
    .tier.hot {
      background: #dc3545;
      color: white;
    }
    
    .tier.warm {
      background: #ffc107;
      color: #000;
    }
    
    .tier.cold {
      background: #6c757d;
      color: white;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>📊 Lead Capture</h1>
    <div class="subtitle">The One'z and Zero</div>
  </div>
  
  <button id="captureBtn">Capture This Post</button>
  
  <div id="status" class="status"></div>
  
  <div class="instructions">
    <strong>How to use:</strong><br>
    1. Find a LinkedIn post about automation<br>
    2. Click "Capture This Post"<br>
    3. Check Telegram for analysis!
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
